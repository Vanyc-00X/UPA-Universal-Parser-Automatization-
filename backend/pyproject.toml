[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "upa-backend"
version = "0.1.0"
description = "UPA (Universal Parser Automatization) — backend: браузер, анализ, движок сценариев"
readme = "../README.MD"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "playwright>=1.45",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
]

[project.scripts]
upa = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Набор тестовых страниц: длинные строки HTML намеренны — разметка читается
# лучше, когда повторяет настоящую вёрстку, а не разбита переносами.
"tests/pages.py" = ["E501"]
# Тесты парсера и инспектора содержат длинные строки разметки по той же причине.
"tests/test_domlite.py" = ["E501"]
"tests/test_resolver.py" = ["E501"]
"tests/test_inspector.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
