# Проект не является монорепозиторием: файл нужен как место для настроек pnpm
# (начиная с pnpm 10 они больше не читаются из package.json).
packages: []

# esbuild (зависимость Vite) при установке скачивает платформенный бинарник.
# pnpm по умолчанию блокирует postinstall-скрипты, без этого `vite` не запускается.
allowBuilds:
  esbuild: true
